name: 🏗️ Build & Push HR Helpdesk Image

on:
  push:
    branches: [ "main", "staging" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & Push Image
        run: |
          IMAGE_NAME=ghcr.io/jhsassociatesllp/jhs-hr-helpdesk

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAG="production"
          else
            TAG="staging"
          fi

          echo "📦 Building: $IMAGE_NAME:$TAG"
          docker build --no-cache --label org.opencontainers.image.source=https://github.com/${{ github.repository }} -t $IMAGE_NAME:$TAG .

          echo "📤 Pushing: $IMAGE_NAME:$TAG"
          docker push $IMAGE_NAME:$TAG
          