

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JHS Helpdesk - Admin Login</title>
    <link rel="stylesheet" href="/static/adminlogin.css?v=brand14">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <img class="brand-logo" src="/static/jhs-logo.webp" alt="JHS logo">
                <h1 id="logoTitle">IT Admin</h1>
                <p>Helpdesk Management System</p>
            </div>

            <form id="loginForm" class="login-form">
                <!-- Helpdesk Type Selector -->
                <div class="form-group">
                    <label for="helpdeskType">Select Helpdesk</label>
                    <select id="helpdeskType" required>
                        <option value="">-- Choose Helpdesk --</option>
                        <option value="hr">HR Helpdesk</option>
                        <option value="it">IT Helpdesk</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="empCode">Employee Code</label>
                    <input 
                        type="text" 
                        id="empCode" 
                        placeholder="JHS0001" 
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="login-btn">
                    <span class="btn-text">Login</span>
                    <span class="btn-loading hidden">Logging in...</span>
                </button>
            </form>

            <div id="loginMessage" class="message hidden"></div>
        </div>
    </div>

    <script src="/static/adminlogin.js?v=brand14"></script>
</body>
</html>
